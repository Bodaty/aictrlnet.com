name: seo
on:
  push:
    branches: [main]
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GH Pages deploy + sitemap drift check
        run: |
          # Minimum total sitemap URLs. Bump deliberately when pages are intentionally removed.
          MIN_TOTAL=70
          # Structural pages that must never silently vanish. A permalink-style page
          # (trailing slash, no .html) is exactly what a naive extension filter drops —
          # that regression shipped 2026-08-10 and the old post-only check did not catch it.
          CRITICAL="/ /blog/ /faq/ /legal/privacy/ /legal/terms/"

          posts=$(grep -L "^published: false" _posts/*.md | wc -l | tr -d ' ')
          for i in $(seq 1 30); do
            sm=$(curl -s https://aictrlnet.com/sitemap.xml)
            live=$(printf '%s' "$sm" | grep -c 'aictrlnet.com/blog/2' || true)
            total=$(printf '%s' "$sm" | grep -c '<loc>' || true)
            [ "$live" -ge "$posts" ] && [ "$total" -ge "$MIN_TOTAL" ] && break
            sleep 20
          done

          fail=0
          if [ "$live" -lt "$posts" ]; then
            echo "::error::sitemap has $live post URLs, repo has $posts"; fail=1
          fi
          if [ "$total" -lt "$MIN_TOTAL" ]; then
            echo "::error::sitemap has $total URLs, floor is $MIN_TOTAL — pages were dropped"; fail=1
          fi
          for p in $CRITICAL; do
            if ! printf '%s' "$sm" | grep -q "<loc>https://aictrlnet.com${p}</loc>"; then
              echo "::error::critical page missing from sitemap: $p"; fail=1
            fi
          done
          # Assets are not pages; a stylesheet in the sitemap wastes crawl budget.
          if printf '%s' "$sm" | grep -qE '<loc>[^<]+\.(css|js|json|txt)</loc>'; then
            echo "::error::non-HTML asset present in sitemap:"
            printf '%s' "$sm" | grep -oE '<loc>[^<]+\.(css|js|json|txt)</loc>'; fail=1
          fi

          echo "sitemap: total=$total posts=$live (repo posts=$posts)"
          exit $fail
      - name: IndexNow ping
        env:
          KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          urls=$(curl -s https://aictrlnet.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -cs .)
          curl -s -w "\nHTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"aictrlnet.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://aictrlnet.com/$KEY.txt\",\"urlList\":$urls}"
